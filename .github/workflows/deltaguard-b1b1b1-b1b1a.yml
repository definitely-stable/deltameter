name: DeltaGuard B1-B1B1-B1B1A WAL crashcut read audit

on:
  pull_request:
    paths:
      - "research/deltaguard_b1b1b1_b1b0_receiver.rs"
      - "research/deltaguard_b1b1b1_b1b1a_crashcuts.rs"
      - "research/deltaguard_b1b1b1_b1b1a_summarize.py"
      - "examples/deltaguard_b1b1b1_b1b1a_crashcuts.rs"
      - "docs/research/DELTAGUARD-B1B1B1-B1B1A-PROTOCOL.md"
      - "docs/research/DELTAGUARD-B1B1B1-B1B1A-EVIDENCE.md"
      - ".github/workflows/deltaguard-b1b1b1-b1b1a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify untouched B2A exact cutoff and Python negative self-tests
        run: |
          mkdir -p bg-cert
          python -m py_compile research/deltaguard_b1b1b1_b1b1a_summarize.py
          python research/deltaguard_b2a_certify.py --out-dir bg-cert | tee bg-cert/log.txt
          grep -q '^B2A_EXACT_CERT_PASS profiles=24 tiny_oracles=39 ' bg-cert/log.txt
          test "$(sha256sum bg-cert/cutoffs.tsv | cut -d' ' -f1)" = "c9bdb9d185be29dd66335d5dfbe456fa562ccaf5c59a6f5f36a0d95f51d9e935"
          git rev-parse HEAD > bg-cert/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bg-cert-${{ github.run_id }}-${{ github.run_attempt }}
          path: bg-cert/
          if-no-files-found: error

  worker:
    needs: certificate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: bg-cert-*
          path: bg-cert
          merge-multiple: true
      - name: Match proof source and strict Rust 2024 source
        run: |
          test "$(cat bg-cert/head.txt)" = "$(git rev-parse HEAD)"
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
      - name: Physically kill 30 receiver children at fixed WAL and checkpoint boundaries
        run: |
          set -euo pipefail
          mkdir -p bg-worker
          cargo run --release --example deltaguard_b1b1b1_b1b1a_crashcuts -- ${{ matrix.worker }} | tee bg-worker/worker-${{ matrix.worker }}.txt
          grep -q '^DELTAGUARD_B1B1B1_B1B1A_WORKER_PASS worker=${{ matrix.worker }} cases=30 repairs=18 reads=120 real_sigkill=30$' bg-worker/worker-${{ matrix.worker }}.txt
          git rev-parse HEAD > bg-worker/head-${{ matrix.worker }}.txt
          rustc -Vv > bg-worker/rust-${{ matrix.worker }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bg-worker-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bg-worker/
          if-no-files-found: warn

  aggregate:
    needs: [certificate, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: bg-worker-*
          path: bg-input
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: bg-cert-*
          path: bg-cert
          merge-multiple: true
      - name: Independent SHA-fixed crash matrix and 600 read-pair audit
        run: |
          mkdir -p bg-summary
          test "$(cat bg-cert/head.txt)" = "$(git rev-parse HEAD)"
          python research/deltaguard_b1b1b1_b1b1a_summarize.py --input bg-input --head "$(git rev-parse HEAD)" --certificate bg-cert/cutoffs.tsv --out bg-summary/summary.json | tee bg-summary/log.txt
          grep -q '^B1B1B1_B1B1A_AGGREGATE_PASS cuts=150 repairs=90 reads=600 verdict=B1B1B1_B1B1A_CRASHCUT_TAIL_REPAIR_RESEARCH_ACCEPT_NO_PRODUCT_GO$' bg-summary/log.txt
          git rev-parse HEAD > bg-summary/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bg-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: bg-summary/
          if-no-files-found: error
