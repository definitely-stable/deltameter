name: DeltaGuard B1-B1B1-A TCP fault full-reset

on:
  pull_request:
    paths:
      - "research/deltaguard_b1b1b1a_failclosed.rs"
      - "research/deltaguard_b1b1b1a_summarize.py"
      - "examples/deltaguard_b1b1b1a_failclosed.rs"
      - "docs/research/DELTAGUARD-B1B1B1A-PROTOCOL.md"
      - "docs/research/DELTAGUARD-B1B1B1A-EVIDENCE.md"
      - ".github/workflows/deltaguard-b1b1b1a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate exact B2A cutoff unchanged
        run: |
          mkdir -p bc-cert
          python -m py_compile research/deltaguard_b1b1b1a_summarize.py
          python research/deltaguard_b2a_certify.py --out-dir bc-cert | tee bc-cert/log.txt
          grep -q '^B2A_EXACT_CERT_PASS profiles=24 tiny_oracles=39 ' bc-cert/log.txt
          test "$(sha256sum bc-cert/cutoffs.tsv | cut -d' ' -f1)" = "c9bdb9d185be29dd66335d5dfbe456fa562ccaf5c59a6f5f36a0d95f51d9e935"
          git rev-parse HEAD > bc-cert/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bc-cert-${{ github.run_id }}-${{ github.run_attempt }}
          path: bc-cert/
          if-no-files-found: error

  worker:
    needs: certificate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: bc-cert-*
          path: bc-cert
          merge-multiple: true
      - name: Match proof/source, Clippy and rustfmt
        run: |
          test "$(cat bc-cert/head.txt)" = "$(git rev-parse HEAD)"
          test "$(sha256sum bc-cert/cutoffs.tsv | cut -d' ' -f1)" = "c9bdb9d185be29dd66335d5dfbe456fa562ccaf5c59a6f5f36a0d95f51d9e935"
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
      - name: Actual 78 fault, NACK/replay and two-owner physical full resets
        run: |
          mkdir -p bc-worker
          cargo run --release --example deltaguard_b1b1b1a_failclosed -- ${{ matrix.worker }} | tee bc-worker/worker-${{ matrix.worker }}.txt
          grep -q "^DELTAGUARD_B1B1B1A_WORKER_PASS worker=${{ matrix.worker }} probes=78 resets=78 ackloss=6 sigkill=6$" bc-worker/worker-${{ matrix.worker }}.txt
          git rev-parse HEAD > bc-worker/head-${{ matrix.worker }}.txt
          rustc -Vv > bc-worker/rust-${{ matrix.worker }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bc-worker-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bc-worker/
          if-no-files-found: warn

  aggregate:
    needs: [certificate, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: bc-worker-*
          path: bc-input
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: bc-cert-*
          path: bc-cert
          merge-multiple: true
      - name: Independent 390 physical fault/cursor/full-reset accounting
        run: |
          mkdir -p bc-summary
          test "$(cat bc-cert/head.txt)" = "$(git rev-parse HEAD)"
          python research/deltaguard_b1b1b1a_summarize.py --input bc-input --head "$(git rev-parse HEAD)" --certificate bc-cert/cutoffs.tsv --out bc-summary/summary.json | tee bc-summary/log.txt
          grep -q '^B1B1B1A_AGGREGATE_PASS records=390 verdict=B1B1B1A_PHYSICAL_FULL_RESET_FAULTS_PASS_NO_PRODUCT_GO$' bc-summary/log.txt
          git rev-parse HEAD > bc-summary/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bc-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: bc-summary/
          if-no-files-found: error
