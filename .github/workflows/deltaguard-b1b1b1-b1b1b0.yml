name: DeltaGuard B1B1B1-B1B1B0 hot service contracts

on:
  pull_request:
    paths:
      - "research/deltaguard_b1b1b1_b1b1b0_hot.rs"
      - "research/deltaguard_b1b1b1_b1b1b0_summarize.py"
      - "examples/deltaguard_b1b1b1_b1b1b0_hot.rs"
      - "docs/research/DELTAGUARD-B1B1B1-B1B1B0-PROTOCOL.md"
      - "docs/research/DELTAGUARD-B1B1B1-B1B1B0-EVIDENCE.md"
      - ".github/workflows/deltaguard-b1b1b1-b1b1b0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify original B2A 24-profile certificate and aggregator
        run: |
          mkdir -p bh-cert
          python -m py_compile research/deltaguard_b1b1b1_b1b1b0_summarize.py
          python research/deltaguard_b2a_certify.py --out-dir bh-cert | tee bh-cert/log.txt
          grep -q '^B2A_EXACT_CERT_PASS profiles=24 tiny_oracles=39 ' bh-cert/log.txt
          test "$(sha256sum bh-cert/cutoffs.tsv | cut -d' ' -f1)" = "c9bdb9d185be29dd66335d5dfbe456fa562ccaf5c59a6f5f36a0d95f51d9e935"
          git rev-parse HEAD > bh-cert/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bh-cert-${{ github.run_id }}-${{ github.run_attempt }}
          path: bh-cert/
          if-no-files-found: error

  worker:
    needs: certificate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: bh-cert-*
          path: bh-cert
          merge-multiple: true
      - name: Source-pinned formatting and strict Clippy
        run: |
          test "$(cat bh-cert/head.txt)" = "$(git rev-parse HEAD)"
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
      - name: 12 private durable owner sessions with matched 20 hot query rounds
        run: |
          set -euo pipefail
          mkdir -p bh-worker
          cargo run --release --example deltaguard_b1b1b1_b1b1b0_hot -- ${{ matrix.worker }} | tee bh-worker/worker-${{ matrix.worker }}.txt
          grep -q '^DELTAGUARD_B1B1B1_B1B1B0_WORKER_PASS worker=${{ matrix.worker }} sessions=12 queries=240$' bh-worker/worker-${{ matrix.worker }}.txt
          git rev-parse HEAD > bh-worker/head-${{ matrix.worker }}.txt
          rustc -Vv > bh-worker/rust-${{ matrix.worker }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bh-worker-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bh-worker/
          if-no-files-found: warn

  aggregate:
    needs: [certificate, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: bh-worker-*
          path: bh-input
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: bh-cert-*
          path: bh-cert
          merge-multiple: true
      - name: Source SHA anchored 1200 observed hot contract pair queries and under-cutoff counts
        run: |
          mkdir -p bh-summary
          test "$(cat bh-cert/head.txt)" = "$(git rev-parse HEAD)"
          python research/deltaguard_b1b1b1_b1b1b0_summarize.py --input bh-input --head "$(git rev-parse HEAD)" --certificate bh-cert/cutoffs.tsv --out bh-summary/summary.json | tee bh-summary/log.txt
          grep -q '^B1B1B1_B1B1B0_AGGREGATE_PASS sessions=60 queries=1200 verdict=B1B1B1_B1B1B0_HOT_CONTRACT_COMPARISON_RESEARCH_ACCEPT_NO_PRODUCT_GO$' bh-summary/log.txt
          git rev-parse HEAD > bh-summary/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bh-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: bh-summary/
          if-no-files-found: error
