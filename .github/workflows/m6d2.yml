name: m6d2-prefix

on:
  pull_request:
    paths:
      - "examples/m6d2_bench.rs"
      - "examples/support/m6d_pinsketch64.rs"
      - "tests/m6d2_prefix.rs"
      - "research/m6d2_summary.py"
      - "docs/superpowers/plans/2026-10-07-m6d2-incremental-prefix.md"
      - ".github/workflows/m6d2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Record environment
        run: |
          mkdir -p "${RUNNER_TEMP}/m6d2"
          rustc +stable -Vv > "${RUNNER_TEMP}/m6d2/rustc.txt"
          lscpu > "${RUNNER_TEMP}/m6d2/cpu.txt"
          git rev-parse HEAD > "${RUNNER_TEMP}/m6d2/head.txt"
          sha256sum examples/m6d2_bench.rs examples/support/m6d_pinsketch64.rs tests/m6d2_prefix.rs research/m6d2_summary.py > "${RUNNER_TEMP}/m6d2/sources-sha256.txt"

      - name: Verify nested prefix correctness
        run: cargo +stable test --release --test m6d2_prefix

      - name: Build release experiment
        run: cargo +stable build --release --example m6d2_bench

      - name: Run repeated prefix evidence
        run: |
          for run in 1 2 3; do
            ./target/release/examples/m6d2_bench > "${RUNNER_TEMP}/m6d2/result-${run}.txt"
          done

      - name: Summarize prefix evidence
        run: |
          set -o pipefail
          python3 research/m6d2_summary.py "${RUNNER_TEMP}/m6d2" | tee "${RUNNER_TEMP}/m6d2/summary.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6d2-prefix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m6d2/
          if-no-files-found: error
