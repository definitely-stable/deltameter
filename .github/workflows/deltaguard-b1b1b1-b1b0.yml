name: DeltaGuard B1-B1B1-B1B0 incremental atomic receiver WAL

on:
  pull_request:
    paths:
      - "research/deltaguard_b1b1b1_b1b0_receiver.rs"
      - "research/deltaguard_b1b1b1_b1b0_summarize.py"
      - "examples/deltaguard_b1b1b1_b1b0_receiver.rs"
      - "docs/research/DELTAGUARD-B1B1B1-B1B0-PROTOCOL.md"
      - "docs/research/DELTAGUARD-B1B1B1-B1B0-EVIDENCE.md"
      - ".github/workflows/deltaguard-b1b1b1-b1b0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate original B2A exact cutoff and strict aggregator
        run: |
          mkdir -p bf-cert
          python -m py_compile research/deltaguard_b1b1b1_b1b0_summarize.py
          python research/deltaguard_b2a_certify.py --out-dir bf-cert | tee bf-cert/log.txt
          grep -q '^B2A_EXACT_CERT_PASS profiles=24 tiny_oracles=39 ' bf-cert/log.txt
          test "$(sha256sum bf-cert/cutoffs.tsv | cut -d' ' -f1)" = "c9bdb9d185be29dd66335d5dfbe456fa562ccaf5c59a6f5f36a0d95f51d9e935"
          git rev-parse HEAD > bf-cert/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bf-cert-${{ github.run_id }}-${{ github.run_attempt }}
          path: bf-cert/
          if-no-files-found: error

  worker:
    needs: certificate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: bf-cert-*
          path: bf-cert
          merge-multiple: true
      - name: Exact source and strict format/Clippy
        run: |
          test "$(cat bf-cert/head.txt)" = "$(git rev-parse HEAD)"
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
      - name: Two-owner 100-gen atomic receiver WAL, checkpoint, SIGKILL, corrupt disk
        run: |
          set -euo pipefail
          mkdir -p bf-worker
          cargo run --release --example deltaguard_b1b1b1_b1b0_receiver -- ${{ matrix.worker }} | tee bf-worker/worker-${{ matrix.worker }}.txt
          grep -q '^DELTAGUARD_B1B1B1B1B0_WORKER_PASS worker=${{ matrix.worker }} records=600 actual_receiver_sigkill=6 negative_groups=6$' bf-worker/worker-${{ matrix.worker }}.txt
          git rev-parse HEAD > bf-worker/head-${{ matrix.worker }}.txt
          rustc -Vv > bf-worker/rust-${{ matrix.worker }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bf-worker-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bf-worker/
          if-no-files-found: warn

  aggregate:
    needs: [certificate, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: bf-worker-*
          path: bf-input
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: bf-cert-*
          path: bf-cert
          merge-multiple: true
      - name: Complete fail-closed 3000 rows, 30 SIGKILL, bounded WAL writes
        run: |
          mkdir -p bf-summary
          test "$(cat bf-cert/head.txt)" = "$(git rev-parse HEAD)"
          python research/deltaguard_b1b1b1_b1b0_summarize.py --input bf-input --head "$(git rev-parse HEAD)" --certificate bf-cert/cutoffs.tsv --out bf-summary/summary.json | tee bf-summary/log.txt
          grep -q '^B1B1B1B1B0_AGGREGATE_PASS records=3000 verdict=B1B1B1_B1B0_INCREMENTAL_RECEIVER_RESEARCH_ACCEPT_NO_PRODUCT_GO$' bf-summary/log.txt
          git rev-parse HEAD > bf-summary/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bf-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: bf-summary/
          if-no-files-found: error
