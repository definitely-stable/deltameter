name: m6d12-post-d11-profile

on:
  pull_request:
    paths:
      - "examples/m6d12_bench.rs"
      - "examples/support/m6d12_residual_profile.rs"
      - "examples/support/m6d11_fixed_reduction.rs"
      - "examples/support/m6d6_quadratic.rs"
      - "examples/support/m6d8_square.rs"
      - "examples/support/m6d4_trace_square.rs"
      - "examples/support/m6d_pinsketch64.rs"
      - "tests/m6d12_residual_profile.rs"
      - "research/m6d12_summary.py"
      - "research/test_m6d12_summary.py"
      - "research/m6d12_replication_summary.py"
      - "research/test_m6d12_replication_summary.py"
      - "docs/superpowers/plans/2026-10-07-m6d12-post-d11-profile.md"
      - ".github/workflows/m6d12.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    name: worker-${{ matrix.worker }}
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Record environment
        run: |
          dir="${RUNNER_TEMP}/m6d12-worker-${{ matrix.worker }}"
          mkdir -p "$dir"
          rustc +stable -Vv > "$dir/rustc.txt"
          lscpu > "$dir/cpu.txt"
          git rev-parse HEAD > "$dir/head.txt"
          printf '%s\n' "${{ matrix.worker }}" > "$dir/worker.txt"
          sha256sum examples/m6d12_bench.rs examples/support/m6d12_residual_profile.rs examples/support/m6d11_fixed_reduction.rs examples/support/m6d6_quadratic.rs examples/support/m6d8_square.rs examples/support/m6d4_trace_square.rs examples/support/m6d_pinsketch64.rs tests/m6d12_residual_profile.rs research/m6d12_summary.py research/m6d12_replication_summary.py .github/workflows/m6d12.yml > "$dir/sources-sha256.txt"

      - name: Verify fail-closed summarizers
        run: |
          PYTHONPATH=research python3 -m unittest research/test_m6d12_summary.py
          PYTHONPATH=research python3 -m unittest research/test_m6d12_replication_summary.py

      - name: Verify post-D11 profiler correctness
        run: cargo +stable test --release --test m6d12_residual_profile

      - name: Build release profiler
        run: cargo +stable build --release --example m6d12_bench

      - name: Run repeated post-D11 profiles
        run: |
          dir="${RUNNER_TEMP}/m6d12-worker-${{ matrix.worker }}"
          for run in 1 2 3; do
            ./target/release/examples/m6d12_bench > "$dir/result-${run}.txt"
          done

      - name: Summarize worker profile
        run: |
          set -o pipefail
          dir="${RUNNER_TEMP}/m6d12-worker-${{ matrix.worker }}"
          PYTHONPATH=research python3 research/m6d12_summary.py "$dir" | tee "$dir/summary.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6d12-worker-${{ matrix.worker }}
          path: ${{ runner.temp }}/m6d12-worker-${{ matrix.worker }}/
          if-no-files-found: error

  replication:
    needs: worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify replication summarizer
        run: PYTHONPATH=research python3 -m unittest research/test_m6d12_replication_summary.py

      - uses: actions/download-artifact@v4
        with:
          pattern: m6d12-worker-*
          path: ${{ runner.temp }}/m6d12-replication

      - name: Summarize independent-worker replication
        run: |
          set -o pipefail
          PYTHONPATH=research python3 research/m6d12_replication_summary.py "${RUNNER_TEMP}/m6d12-replication" | tee "${RUNNER_TEMP}/m6d12-replication-summary.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6d12-replication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m6d12-replication/
            ${{ runner.temp }}/m6d12-replication-summary.txt
          if-no-files-found: error
