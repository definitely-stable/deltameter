name: DeltaGuard B1-B1-A two-process paced TCP research

on:
  pull_request:
    paths:
      - "research/deltaguard_b1b1a.rs"
      - "research/deltaguard_b1b1a_summarize.py"
      - "examples/deltaguard_b1b1a.rs"
      - "docs/research/DELTAGUARD-B1B1A-PROTOCOL.md"
      - "docs/research/DELTAGUARD-B1B1A-EVIDENCE.md"
      - ".github/workflows/deltaguard-b1b1a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Pin 24 profile B2A proof without modifying cutoff
        run: |
          mkdir -p b11-cert
          python -m py_compile research/deltaguard_b1b1a_summarize.py
          python research/deltaguard_b2a_certify.py --out-dir b11-cert | tee b11-cert/log.txt
          grep -q '^B2A_EXACT_CERT_PASS profiles=24 tiny_oracles=39 ' b11-cert/log.txt
          test "$(sha256sum b11-cert/cutoffs.tsv | cut -d' ' -f1)" = "c9bdb9d185be29dd66335d5dfbe456fa562ccaf5c59a6f5f36a0d95f51d9e935"
          git rev-parse HEAD > b11-cert/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: b11-cert-${{ github.run_id }}-${{ github.run_attempt }}
          path: b11-cert/
          if-no-files-found: error

  worker:
    needs: certificate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: b11-cert-*
          path: b11-cert
          merge-multiple: true
      - name: Pin source and check Rust surface
        run: |
          test "$(cat b11-cert/head.txt)" = "$(git rev-parse HEAD)"
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
      - name: Actual sender processes, paced loopback TCP and physical warm/cold exact
        run: |
          mkdir -p b11-worker
          cargo run --release --example deltaguard_b1b1a -- ${{ matrix.worker }} | tee b11-worker/worker-${{ matrix.worker }}.txt
          grep -q "^DELTAGUARD_B1B1A_WORKER_PASS worker=${{ matrix.worker }} records=60$" b11-worker/worker-${{ matrix.worker }}.txt
          git rev-parse HEAD > b11-worker/head-${{ matrix.worker }}.txt
          rustc -Vv > b11-worker/rust-${{ matrix.worker }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b11-worker-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: b11-worker/
          if-no-files-found: warn

  aggregate:
    needs: [certificate,worker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: b11-worker-*
          path: b11-input
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: b11-cert-*
          path: b11-cert
          merge-multiple: true
      - name: Fail closed exact 300 process/physical byte/p95 records
        run: |
          mkdir -p b11-summary
          test "$(cat b11-cert/head.txt)" = "$(git rev-parse HEAD)"
          python research/deltaguard_b1b1a_summarize.py --input b11-input --head "$(git rev-parse HEAD)" --certificate b11-cert/cutoffs.tsv --out b11-summary/summary.json | tee b11-summary/log.txt
          grep -q '^B1B1A_AGGREGATE_PASS records=300 verdict=B1B1A_PHYSICAL_TWO_PROCESS_COST_FOUNDATION_PASS_NO_PRODUCT_GO$' b11-summary/log.txt
          git rev-parse HEAD > b11-summary/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: b11-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: b11-summary/
          if-no-files-found: error
