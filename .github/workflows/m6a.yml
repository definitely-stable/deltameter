name: m6a-value\n\non:\n  pull_request:\n    paths:\n      - "Cargo.toml"\n      - "src/**"\n      - "examples/m6a_experiment.rs"\n      - "research/m6a_value_summary.py"\n      - "docs/superpowers/plans/2026-10-06-m6a-value-experiment.md"\n      - ".github/workflows/m6a.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  experiment:\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    steps:\n      - uses: actions/checkout@v5\n        with:\n          ref: ${{ github.event.pull_request.head.sha || github.sha }}\n\n      - name: Install stable Rust\n        run: rustup toolchain install stable --profile minimal\n\n      - name: Record environment\n        run: |\n          mkdir -p "${RUNNER_TEMP}/m6a"\n          rustc +stable -Vv > "${RUNNER_TEMP}/m6a/rustc.txt"\n          lscpu > "${RUNNER_TEMP}/m6a/cpu.txt"\n          git rev-parse HEAD > "${RUNNER_TEMP}/m6a/head.txt"\n          sha256sum \\n            examples/m6a_experiment.rs \\n            research/m6a_value_summary.py \\n            > "${RUNNER_TEMP}/m6a/source-sha256.txt"\n\n      - name: Build release experiment\n        run: cargo +stable build --release --example m6a_experiment\n\n      - name: Run deterministic value experiment\n        run: |\n          for run in 1 2 3 4 5; do\n            ./target/release/examples/m6a_experiment \\n              > "${RUNNER_TEMP}/m6a/result-${run}.csv"\n          done\n\n      - name: Summarize value evidence\n        run: |\n          set -o pipefail\n          python3 research/m6a_value_summary.py "${RUNNER_TEMP}/m6a" \\n            | tee "${RUNNER_TEMP}/m6a/summary.txt"\n\n      - uses: actions/upload-artifact@v4\n        if: always()\n        with:\n          name: m6a-value-${{ github.run_id }}-${{ github.run_attempt }}\n          path: ${{ runner.temp }}/m6a/\n          if-no-files-found: error\n