name: m6d5-root-profile

on:
  pull_request:
    paths:
      - "examples/m6d5_bench.rs"
      - "examples/support/m6d5_root_profile.rs"
      - "examples/support/m6d4_trace_square.rs"
      - "examples/support/m6d_pinsketch64.rs"
      - "tests/m6d5_root_profile.rs"
      - "research/m6d5_summary.py"
      - "research/test_m6d5_summary.py"
      - "docs/superpowers/plans/2026-10-07-m6d5-root-profile.md"
      - ".github/workflows/m6d5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Record environment
        run: |
          mkdir -p "${RUNNER_TEMP}/m6d5"
          rustc +stable -Vv > "${RUNNER_TEMP}/m6d5/rustc.txt"
          lscpu > "${RUNNER_TEMP}/m6d5/cpu.txt"
          git rev-parse HEAD > "${RUNNER_TEMP}/m6d5/head.txt"
          sha256sum examples/m6d5_bench.rs examples/support/m6d5_root_profile.rs examples/support/m6d4_trace_square.rs examples/support/m6d_pinsketch64.rs tests/m6d5_root_profile.rs research/m6d5_summary.py research/test_m6d5_summary.py .github/workflows/m6d5.yml > "${RUNNER_TEMP}/m6d5/sources-sha256.txt"

      - name: Verify fail-closed summarizer
        run: python3 -m unittest discover -s research -p test_m6d5_summary.py

      - name: Verify profile correctness
        run: cargo +stable test --release --test m6d5_root_profile

      - name: Build release profiler
        run: cargo +stable build --release --example m6d5_bench

      - name: Run repeated root profiles
        run: |
          for run in 1 2 3; do
            ./target/release/examples/m6d5_bench > "${RUNNER_TEMP}/m6d5/result-${run}.txt"
          done

      - name: Summarize root profiles
        run: |
          set -o pipefail
          PYTHONPATH=research python3 research/m6d5_summary.py "${RUNNER_TEMP}/m6d5" | tee "${RUNNER_TEMP}/m6d5/summary.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6d5-root-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m6d5/
          if-no-files-found: error
