name: DeltaGuard B1-B1B1-B0 durable WAL crash replay

on:
  pull_request:
    paths:
      - "research/deltaguard_b1b1b1b0_durable.rs"
      - "research/deltaguard_b1b1b1b0_summarize.py"
      - "examples/deltaguard_b1b1b1b0_durable.rs"
      - "docs/research/DELTAGUARD-B1B1B1B0-PROTOCOL.md"
      - "docs/research/DELTAGUARD-B1B1B1B0-EVIDENCE.md"
      - ".github/workflows/deltaguard-b1b1b1b0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate immutable B2A exact cutoff
        run: |
          mkdir -p bd-cert
          python -m py_compile research/deltaguard_b1b1b1b0_summarize.py
          python research/deltaguard_b2a_certify.py --out-dir bd-cert | tee bd-cert/log.txt
          grep -q '^B2A_EXACT_CERT_PASS profiles=24 tiny_oracles=39 ' bd-cert/log.txt
          test "$(sha256sum bd-cert/cutoffs.tsv | cut -d' ' -f1)" = "c9bdb9d185be29dd66335d5dfbe456fa562ccaf5c59a6f5f36a0d95f51d9e935"
          git rev-parse HEAD > bd-cert/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bd-cert-${{ github.run_id }}-${{ github.run_attempt }}
          path: bd-cert/
          if-no-files-found: error

  worker:
    needs: certificate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: bd-cert-*
          path: bd-cert
          merge-multiple: true
      - name: Pin source and strict rustfmt/Clippy
        run: |
          test "$(cat bd-cert/head.txt)" = "$(git rev-parse HEAD)"
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
      - name: Two SIGKILL owners, real fsync WAL, and independent receiver restart
        run: |
          set -euo pipefail
          mkdir -p bd-worker
          cargo run --release --example deltaguard_b1b1b1b0_durable -- ${{ matrix.worker }} | tee bd-worker/worker-${{ matrix.worker }}.txt
          grep -q '^DELTAGUARD_B1B1B1B0_WORKER_PASS worker=${{ matrix.worker }} records=42 negative=5$' bd-worker/worker-${{ matrix.worker }}.txt
          git rev-parse HEAD > bd-worker/head-${{ matrix.worker }}.txt
          rustc -Vv > bd-worker/rust-${{ matrix.worker }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bd-worker-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bd-worker/
          if-no-files-found: warn

  aggregate:
    needs: [certificate,worker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: bd-worker-*
          path: bd-input
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: bd-cert-*
          path: bd-cert
          merge-multiple: true
      - name: Fail-closed 210 owner-WAL/disk cursor source-bound proof
        run: |
          mkdir -p bd-summary
          test "$(cat bd-cert/head.txt)" = "$(git rev-parse HEAD)"
          python research/deltaguard_b1b1b1b0_summarize.py --input bd-input --head "$(git rev-parse HEAD)" --certificate bd-cert/cutoffs.tsv --out bd-summary/summary.json | tee bd-summary/log.txt
          grep -q '^B1B1B1B0_AGGREGATE_PASS records=210 verdict=B1B1B1B0_DURABLE_PREFIX_REPLAY_RESEARCH_ACCEPT_NO_PRODUCT_GO$' bd-summary/log.txt
          git rev-parse HEAD > bd-summary/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bd-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: bd-summary/
          if-no-files-found: error
