name: m6c-performance

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "src/**"
      - "tests/snapshot_v1.rs"
      - "examples/m6c_bench.rs"
      - "research/m6c_perf_summary.py"
      - ".github/workflows/m6c-perf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Prepare identical base/head sources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "${RUNNER_TEMP}/m6c"
          rustc +stable -Vv > "${RUNNER_TEMP}/m6c/rustc.txt"
          lscpu > "${RUNNER_TEMP}/m6c/cpu.txt"
          printf 'base=%s\nhead=%s\n' "${BASE_SHA}" "${HEAD_SHA}" > "${RUNNER_TEMP}/m6c/refs.txt"
          cp examples/m6c_bench.rs "${RUNNER_TEMP}/m6c_bench.rs"
          cp tests/snapshot_v1.rs "${RUNNER_TEMP}/snapshot_v1.rs"
          cp research/m6c_perf_summary.py "${RUNNER_TEMP}/m6c_perf_summary.py"
          sha256sum "${RUNNER_TEMP}/m6c_bench.rs" "${RUNNER_TEMP}/snapshot_v1.rs" "${RUNNER_TEMP}/m6c_perf_summary.py" > "${RUNNER_TEMP}/m6c/sources-sha256.txt"
          for variant in base head; do
            if [ "${variant}" = base ]; then source_sha="${BASE_SHA}"; else source_sha="${HEAD_SHA}"; fi
            git worktree add --detach "${RUNNER_TEMP}/m6c-${variant}" "${source_sha}"
            cp "${RUNNER_TEMP}/m6c_bench.rs" "${RUNNER_TEMP}/m6c-${variant}/examples/m6c_bench.rs"
            cp "${RUNNER_TEMP}/snapshot_v1.rs" "${RUNNER_TEMP}/m6c-${variant}/tests/snapshot_v1.rs"
            (cd "${RUNNER_TEMP}/m6c-${variant}" && cargo +stable test --test snapshot_v1) 2>&1 | tee "${RUNNER_TEMP}/m6c/${variant}-compatibility.txt"
            (cd "${RUNNER_TEMP}/m6c-${variant}" && cargo +stable build --release --example m6c_bench)
            cp "${RUNNER_TEMP}/m6c-${variant}/target/release/examples/m6c_bench" "${RUNNER_TEMP}/m6c-${variant}-bench"
          done

      - name: Alternating paired rounds
        run: |
          for round in 1 2 3 4; do
            if [ $((round % 2)) = 1 ]; then order="base head"; else order="head base"; fi
            printf 'round=%s order=%s\n' "${round}" "${order}" >> "${RUNNER_TEMP}/m6c/order.txt"
            for variant in ${order}; do
              "${RUNNER_TEMP}/m6c-${variant}-bench" 5 > "${RUNNER_TEMP}/m6c/${round}-${variant}.txt"
            done
          done

      - name: Summarize paired evidence
        run: |
          set -o pipefail
          python3 "${RUNNER_TEMP}/m6c_perf_summary.py" "${RUNNER_TEMP}/m6c" | tee "${RUNNER_TEMP}/m6c/summary.csv"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6c-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m6c/
          if-no-files-found: error
