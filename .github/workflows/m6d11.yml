name: m6d11-fixed-reduction

on:
  pull_request:
    paths:
      - "examples/m6d11_bench.rs"
      - "examples/support/m6d11_fixed_reduction.rs"
      - "examples/support/m6d8_square.rs"
      - "examples/support/m6d6_quadratic.rs"
      - "examples/support/m6d4_trace_square.rs"
      - "examples/support/m6d_pinsketch64.rs"
      - "tests/m6d11_fixed_reduction.rs"
      - "research/m6d11_summary.py"
      - "research/test_m6d11_summary.py"
      - "docs/superpowers/plans/2026-10-07-m6d11-fixed-reduction.md"
      - ".github/workflows/m6d11.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Record environment
        run: |
          mkdir -p "${RUNNER_TEMP}/m6d11"
          rustc +stable -Vv > "${RUNNER_TEMP}/m6d11/rustc.txt"
          lscpu > "${RUNNER_TEMP}/m6d11/cpu.txt"
          git rev-parse HEAD > "${RUNNER_TEMP}/m6d11/head.txt"
          sha256sum examples/m6d11_bench.rs examples/support/m6d11_fixed_reduction.rs examples/support/m6d8_square.rs examples/support/m6d6_quadratic.rs examples/support/m6d4_trace_square.rs examples/support/m6d_pinsketch64.rs tests/m6d11_fixed_reduction.rs research/m6d11_summary.py research/test_m6d11_summary.py .github/workflows/m6d11.yml > "${RUNNER_TEMP}/m6d11/sources-sha256.txt"

      - name: Verify fail-closed summarizer
        run: PYTHONPATH=research python3 -m unittest research/test_m6d11_summary.py

      - name: Verify fixed reduction correctness
        run: cargo +stable test --release --test m6d11_fixed_reduction

      - name: Build release benchmark
        run: cargo +stable build --release --example m6d11_bench

      - name: Run repeated paired evidence
        run: |
          for run in 1 2 3; do
            ./target/release/examples/m6d11_bench > "${RUNNER_TEMP}/m6d11/result-${run}.txt"
          done

      - name: Summarize paired evidence
        run: |
          set -o pipefail
          PYTHONPATH=research python3 research/m6d11_summary.py "${RUNNER_TEMP}/m6d11" | tee "${RUNNER_TEMP}/m6d11/summary.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6d11-fixed-reduction-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m6d11/
          if-no-files-found: error
