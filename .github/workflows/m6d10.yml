name: m6d10-trace-internal

on:
  pull_request:
    paths:
      - "examples/m6d10_bench.rs"
      - "examples/support/m6d10_trace_internal.rs"
      - "examples/support/m6d8_square.rs"
      - "examples/support/m6d6_quadratic.rs"
      - "examples/support/m6d4_trace_square.rs"
      - "examples/support/m6d_pinsketch64.rs"
      - "tests/m6d10_trace_internal.rs"
      - "research/m6d10_summary.py"
      - "research/test_m6d10_summary.py"
      - "docs/superpowers/plans/2026-10-07-m6d10-trace-internal.md"
      - ".github/workflows/m6d10.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Record environment
        run: |
          mkdir -p "${RUNNER_TEMP}/m6d10"
          rustc +stable -Vv > "${RUNNER_TEMP}/m6d10/rustc.txt"
          lscpu > "${RUNNER_TEMP}/m6d10/cpu.txt"
          git rev-parse HEAD > "${RUNNER_TEMP}/m6d10/head.txt"
          sha256sum examples/m6d10_bench.rs examples/support/m6d10_trace_internal.rs examples/support/m6d8_square.rs examples/support/m6d6_quadratic.rs examples/support/m6d4_trace_square.rs examples/support/m6d_pinsketch64.rs tests/m6d10_trace_internal.rs research/m6d10_summary.py research/test_m6d10_summary.py .github/workflows/m6d10.yml > "${RUNNER_TEMP}/m6d10/sources-sha256.txt"

      - name: Verify fail-closed summarizer
        run: PYTHONPATH=research python3 -m unittest research/test_m6d10_summary.py

      - name: Verify trace replay correctness
        run: cargo +stable test --release --test m6d10_trace_internal

      - name: Build release replay benchmark
        run: cargo +stable build --release --example m6d10_bench

      - name: Run repeated trace replay measurements
        run: |
          for run in 1 2 3; do
            ./target/release/examples/m6d10_bench > "${RUNNER_TEMP}/m6d10/result-${run}.txt"
          done

      - name: Summarize trace replay measurements
        run: |
          set -o pipefail
          PYTHONPATH=research python3 research/m6d10_summary.py "${RUNNER_TEMP}/m6d10" | tee "${RUNNER_TEMP}/m6d10/summary.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6d10-trace-internal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m6d10/
          if-no-files-found: error
