name: performance

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "src/**"
      - "examples/m4_bench.rs"
      - ".github/workflows/perf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m4:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv

      - name: Runner CPU
        run: lscpu

      - name: Preserve M4 harness
        if: github.event_name == 'pull_request'
        run: cp examples/m4_bench.rs "${RUNNER_TEMP}/m4_bench.rs"

      - name: Benchmark base on the same runner
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout --detach "${BASE_SHA}"
          cp "${RUNNER_TEMP}/m4_bench.rs" examples/m4_bench.rs
          cargo build --release --example m4_bench
          ./target/release/examples/m4_bench 2000 5 | tee "${RUNNER_TEMP}/m4-perf-base.txt"

      - name: Benchmark head on the same runner
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git checkout --detach "${HEAD_SHA}"
          fi
          cargo build --release --example m4_bench
          ./target/release/examples/m4_bench 2000 5 | tee "${RUNNER_TEMP}/m4-perf-head.txt"

      - name: Collect diagnostic evidence
        run: |
          mkdir -p m4-perf
          if [ -f "${RUNNER_TEMP}/m4-perf-base.txt" ]; then
            cp "${RUNNER_TEMP}/m4-perf-base.txt" m4-perf/base.txt
          fi
          cp "${RUNNER_TEMP}/m4-perf-head.txt" m4-perf/head.txt

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: m4-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: m4-perf/
          if-no-files-found: error
