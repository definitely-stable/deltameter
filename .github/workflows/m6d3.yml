name: m6d3-incremental-bm

on:
  pull_request:
    paths:
      - "examples/m6d3_bench.rs"
      - "examples/support/m6d3_incremental_bm.rs"
      - "examples/support/m6d_pinsketch64.rs"
      - "tests/m6d3_incremental_bm.rs"
      - "research/m6d3_summary.py"
      - "docs/superpowers/plans/2026-10-07-m6d3-incremental-bm.md"
      - ".github/workflows/m6d3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Record environment
        run: |
          mkdir -p "${RUNNER_TEMP}/m6d3"
          rustc +stable -Vv > "${RUNNER_TEMP}/m6d3/rustc.txt"
          lscpu > "${RUNNER_TEMP}/m6d3/cpu.txt"
          git rev-parse HEAD > "${RUNNER_TEMP}/m6d3/head.txt"
          sha256sum examples/m6d3_bench.rs examples/support/m6d3_incremental_bm.rs examples/support/m6d_pinsketch64.rs tests/m6d3_incremental_bm.rs research/m6d3_summary.py > "${RUNNER_TEMP}/m6d3/sources-sha256.txt"

      - name: Verify incremental BM correctness
        run: cargo +stable test --release --test m6d3_incremental_bm

      - name: Build release benchmark
        run: cargo +stable build --release --example m6d3_bench

      - name: Run repeated decoder evidence
        run: |
          for run in 1 2 3; do
            ./target/release/examples/m6d3_bench > "${RUNNER_TEMP}/m6d3/result-${run}.txt"
          done

      - name: Summarize decoder evidence
        run: |
          set -o pipefail
          python3 research/m6d3_summary.py "${RUNNER_TEMP}/m6d3" | tee "${RUNNER_TEMP}/m6d3/summary.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6d3-incremental-bm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m6d3/
          if-no-files-found: error
