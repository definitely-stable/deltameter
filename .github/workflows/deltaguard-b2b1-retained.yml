name: DeltaGuard B2-B1-B0 actual retained exact and fallback

on:
  pull_request:
    paths:
      - "research/deltaguard_b2b1_retained.rs"
      - "research/deltaguard_b2b1_retained_summarize.py"
      - "examples/deltaguard_b2b1_retained.rs"
      - "docs/research/DELTAGUARD-G1B2B1B0-PROTOCOL.md"
      - "docs/research/DELTAGUARD-G1B2B1B0-EVIDENCE.md"
      - ".github/workflows/deltaguard-b2b1-retained.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate exact B2A cutoff and pin source
        run: |
          python -m py_compile research/deltaguard_b2b1_retained_summarize.py
          mkdir -p b1b0-cert
          python research/deltaguard_b2a_certify.py --out-dir b1b0-cert | tee b1b0-cert/log.txt
          grep -q '^B2A_EXACT_CERT_PASS profiles=24 tiny_oracles=39 ' b1b0-cert/log.txt
          test "$(sha256sum b1b0-cert/cutoffs.tsv | cut -d' ' -f1)" = "c9bdb9d185be29dd66335d5dfbe456fa562ccaf5c59a6f5f36a0d95f51d9e935"
          git rev-parse HEAD > b1b0-cert/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: b1b0-cert-${{ github.run_id }}-${{ github.run_attempt }}
          path: b1b0-cert/
          if-no-files-found: error

  worker:
    needs: certificate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: b1b0-cert-*
          path: b1b0-cert
          merge-multiple: true
      - name: Verify exact source and format/lint
        run: |
          test "$(cat b1b0-cert/head.txt)" = "$(git rev-parse HEAD)"
          test "$(sha256sum b1b0-cert/cutoffs.tsv | cut -d' ' -f1)" = "c9bdb9d185be29dd66335d5dfbe456fa562ccaf5c59a6f5f36a0d95f51d9e935"
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
      - name: Actual physical TCP retained source exact and resolved fallback
        run: |
          mkdir -p b1b0-worker
          cargo run --release --example deltaguard_b2b1_retained -- ${{ matrix.worker }} | tee b1b0-worker/worker-${{ matrix.worker }}.txt
          grep -q "^DELTAGUARD_B1B0_WORKER_PASS worker=${{ matrix.worker }} samples=72$" b1b0-worker/worker-${{ matrix.worker }}.txt
          git rev-parse HEAD > b1b0-worker/head-${{ matrix.worker }}.txt
          rustc -Vv > b1b0-worker/rust-${{ matrix.worker }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1b0-worker-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: b1b0-worker/
          if-no-files-found: warn

  aggregate:
    needs: [certificate, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: b1b0-worker-*
          path: b1b0-input
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: b1b0-cert-*
          path: b1b0-cert
          merge-multiple: true
      - name: Fail-closed exact all 360 samples and physical frame accounting
        run: |
          mkdir -p b1b0-summary
          test "$(cat b1b0-cert/head.txt)" = "$(git rev-parse HEAD)"
          python research/deltaguard_b2b1_retained_summarize.py --input b1b0-input --certificate b1b0-cert/cutoffs.tsv --head "$(git rev-parse HEAD)" --out b1b0-summary/summary.json | tee b1b0-summary/log.txt
          grep -q '^B1B0_AGGREGATE_PASS samples=360 verdict=B1B0_RETAINED_PHYSICAL_EXACT_FALLBACK_PASS$' b1b0-summary/log.txt
          git rev-parse HEAD > b1b0-summary/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: b1b0-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: b1b0-summary/
          if-no-files-found: error
