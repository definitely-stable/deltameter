name: DeltaGuard B1-B1B0 persistent hot-hot TCP

on:
  pull_request:
    paths:
      - "research/deltaguard_b1b1b0_persistent.rs"
      - "research/deltaguard_b1b1b0_summarize.py"
      - "examples/deltaguard_b1b1b0_persistent.rs"
      - "docs/research/DELTAGUARD-B1B1B0-PROTOCOL.md"
      - "docs/research/DELTAGUARD-B1B1B0-EVIDENCE.md"
      - ".github/workflows/deltaguard-b1b1b0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate and pin published B2A exact cutoff
        run: |
          mkdir -p bb-cert
          python -m py_compile research/deltaguard_b1b1b0_summarize.py
          python research/deltaguard_b2a_certify.py --out-dir bb-cert | tee bb-cert/log.txt
          grep -q '^B2A_EXACT_CERT_PASS profiles=24 tiny_oracles=39 ' bb-cert/log.txt
          test "$(sha256sum bb-cert/cutoffs.tsv | cut -d' ' -f1)" = "c9bdb9d185be29dd66335d5dfbe456fa562ccaf5c59a6f5f36a0d95f51d9e935"
          git rev-parse HEAD > bb-cert/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bb-cert-${{ github.run_id }}-${{ github.run_attempt }}
          path: bb-cert/
          if-no-files-found: error

  worker:
    needs: certificate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: bb-cert-*
          path: bb-cert
          merge-multiple: true
      - name: Check source, exact certificate, format and Clippy
        run: |
          test "$(cat bb-cert/head.txt)" = "$(git rev-parse HEAD)"
          test "$(sha256sum bb-cert/cutoffs.tsv | cut -d' ' -f1)" = "c9bdb9d185be29dd66335d5dfbe456fa562ccaf5c59a6f5f36a0d95f51d9e935"
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
      - name: Physical persistent dual-owner TCP hot/hot and NACK retry
        run: |
          mkdir -p bb-worker
          cargo run --release --example deltaguard_b1b1b0_persistent -- ${{ matrix.worker }} | tee bb-worker/worker-${{ matrix.worker }}.txt
          grep -q '^DELTAGUARD_B1B1B0_WORKER_PASS worker=${{ matrix.worker }} records=200 retry_tests=3$' bb-worker/worker-${{ matrix.worker }}.txt
          git rev-parse HEAD > bb-worker/head-${{ matrix.worker }}.txt
          rustc -Vv > bb-worker/rust-${{ matrix.worker }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bb-worker-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bb-worker/
          if-no-files-found: warn

  aggregate:
    needs: [certificate,worker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: bb-worker-*
          path: bb-input
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: bb-cert-*
          path: bb-cert
          merge-multiple: true
      - name: Fail-closed complete 1000 records, RSS, hot p95 and replay
        run: |
          mkdir -p bb-summary
          test "$(cat bb-cert/head.txt)" = "$(git rev-parse HEAD)"
          python research/deltaguard_b1b1b0_summarize.py --input bb-input --head "$(git rev-parse HEAD)" --certificate bb-cert/cutoffs.tsv --out bb-summary/summary.json | tee bb-summary/log.txt
          grep -q '^B1B1B0_AGGREGATE_PASS records=1000 verdict=B1B1B0_PERSISTENT_HOT_HOT_CORRECTNESS_ACCEPT_NO_PRODUCT_GO$' bb-summary/log.txt
          git rev-parse HEAD > bb-summary/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bb-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: bb-summary/
          if-no-files-found: error
