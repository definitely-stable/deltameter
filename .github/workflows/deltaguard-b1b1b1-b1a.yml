name: DeltaGuard B1-B1B1-B1A chain receipt ABA

on:
  pull_request:
    paths:
      - "research/deltaguard_b1b1b1a_chain.rs"
      - "research/deltaguard_b1b1b1_b1a_summarize.py"
      - "examples/deltaguard_b1b1b1a_chain.rs"
      - "docs/research/DELTAGUARD-B1B1B1-B1A-PROTOCOL.md"
      - "docs/research/DELTAGUARD-B1B1B1-B1A-EVIDENCE.md"
      - ".github/workflows/deltaguard-b1b1b1-b1a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify unchanged 24-profile exact proof
        run: |
          mkdir -p be-cert
          python -m py_compile research/deltaguard_b1b1b1_b1a_summarize.py
          python research/deltaguard_b2a_certify.py --out-dir be-cert | tee be-cert/log.txt
          grep -q '^B2A_EXACT_CERT_PASS profiles=24 tiny_oracles=39 ' be-cert/log.txt
          test "$(sha256sum be-cert/cutoffs.tsv | cut -d' ' -f1)" = "c9bdb9d185be29dd66335d5dfbe456fa562ccaf5c59a6f5f36a0d95f51d9e935"
          git rev-parse HEAD > be-cert/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: be-cert-${{ github.run_id }}-${{ github.run_attempt }}
          path: be-cert/
          if-no-files-found: error

  worker:
    needs: certificate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: be-cert-*
          path: be-cert
          merge-multiple: true
      - name: Strict Rust source, proof and formatting
        run: |
          test "$(cat be-cert/head.txt)" = "$(git rev-parse HEAD)"
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
      - name: Two owner 100-generation TCP ABA chain and receiver SIGKILL
        run: |
          set -euo pipefail
          mkdir -p be-worker
          cargo run --release --example deltaguard_b1b1b1a_chain -- ${{ matrix.worker }} | tee be-worker/worker-${{ matrix.worker }}.txt
          grep -q '^DELTAGUARD_B1B1B1A_WORKER_PASS worker=${{ matrix.worker }} records=600 actual_receiver_sigkill=6 negative_groups=6$' be-worker/worker-${{ matrix.worker }}.txt
          git rev-parse HEAD > be-worker/head-${{ matrix.worker }}.txt
          rustc -Vv > be-worker/rust-${{ matrix.worker }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: be-worker-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: be-worker/
          if-no-files-found: warn

  aggregate:
    needs: [certificate,worker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: be-worker-*
          path: be-input
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: be-cert-*
          path: be-cert
          merge-multiple: true
      - name: Reject incomplete generation, forged bytes, missing first-ACK SIGKILL
        run: |
          mkdir -p be-summary
          test "$(cat be-cert/head.txt)" = "$(git rev-parse HEAD)"
          python research/deltaguard_b1b1b1_b1a_summarize.py --input be-input --head "$(git rev-parse HEAD)" --certificate be-cert/cutoffs.tsv --out be-summary/summary.json | tee be-summary/log.txt
          grep -q '^B1B1B1A_AGGREGATE_PASS records=3000 verdict=B1B1B1_B1A_ABA_RECEIPT_CHAIN_RESEARCH_ACCEPT_NO_PRODUCT_GO$' be-summary/log.txt
          git rev-parse HEAD > be-summary/head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: be-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: be-summary/
          if-no-files-found: error
