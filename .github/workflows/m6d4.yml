name: m6d4-trace-square

on:
  pull_request:
    paths:
      - "examples/m6d4_bench.rs"
      - "examples/support/m6d4_trace_square.rs"
      - "examples/support/m6d_pinsketch64.rs"
      - "tests/m6d4_trace_square.rs"
      - "research/m6d4_summary.py"
      - "research/test_m6d4_summary.py"
      - "examples/support/m6d3_incremental_bm.rs"
      - "docs/superpowers/plans/2026-10-07-m6d4-trace-square.md"
      - ".github/workflows/m6d4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Record environment
        run: |
          mkdir -p "${RUNNER_TEMP}/m6d4"
          rustc +stable -Vv > "${RUNNER_TEMP}/m6d4/rustc.txt"
          lscpu > "${RUNNER_TEMP}/m6d4/cpu.txt"
          git rev-parse HEAD > "${RUNNER_TEMP}/m6d4/head.txt"
          sha256sum examples/m6d4_bench.rs examples/support/m6d4_trace_square.rs examples/support/m6d_pinsketch64.rs examples/support/m6d3_incremental_bm.rs tests/m6d4_trace_square.rs research/m6d4_summary.py research/test_m6d4_summary.py .github/workflows/m6d4.yml > "${RUNNER_TEMP}/m6d4/sources-sha256.txt"

      - name: Show provenance
        run: |
          cat "${RUNNER_TEMP}/m6d4/head.txt" "${RUNNER_TEMP}/m6d4/rustc.txt" "${RUNNER_TEMP}/m6d4/cpu.txt" "${RUNNER_TEMP}/m6d4/sources-sha256.txt"

      - name: Verify fail-closed summarizer
        run: python3 -m unittest discover -s research -p test_m6d4_summary.py

      - name: Verify trace-square correctness
        run: cargo +stable test --release --test m6d4_trace_square

      - name: Build release benchmark
        run: cargo +stable build --release --example m6d4_bench

      - name: Run repeated trace-square evidence
        run: |
          for run in 1 2 3; do
            ./target/release/examples/m6d4_bench > "${RUNNER_TEMP}/m6d4/result-${run}.txt"
          done

      - name: Summarize trace-square evidence
        run: |
          set -o pipefail
          python3 research/m6d4_summary.py "${RUNNER_TEMP}/m6d4" | tee "${RUNNER_TEMP}/m6d4/summary.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6d4-trace-square-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m6d4/
          if-no-files-found: error
