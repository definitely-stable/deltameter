name: strict-compact opt-c3c sender-first TCP

on:
  pull_request:
    paths:
      - "docs/research/STRICT-COMPACT-OPT-C3C-PROTOCOL.md"
      - "research/strict_compact_opt_c3_sender_first.rs"
      - "research/strict_compact_opt_c3_sender_first_summarize.py"
      - "examples/strict_compact_opt_c3_lab.rs"
      - ".github/workflows/strict-compact-opt-c3c-sender-first.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Validate source and original Q32 oracle
        run: |
          mkdir -p c3c-raw
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          python -m py_compile research/strict_compact_opt_c3_sender_first_summarize.py
          python research/strict_compact_lookup_q32.py --table-out c3c-raw/q32.txt
          test "$(sha256sum c3c-raw/q32.txt | cut -d' ' -f1)" = 634ea5dd196e0e03fc74422a85d926351c7c81b42b0d9ba724fccfd45fb3cc7a
      - name: Collect actual sender-first two TCP sender multi-round samples
        run: |
          cargo run --release --example strict_compact_opt_c3_lab -- c3c-raw/q32.txt ${{ matrix.worker }} senderfirst | tee c3c-raw/worker-${{ matrix.worker }}.txt
          grep -q "^STRICT_COMPACT_OPT_C3C_WORKER_PASS worker=${{ matrix.worker }}$" c3c-raw/worker-${{ matrix.worker }}.txt
          git rev-parse HEAD > c3c-raw/head-${{ matrix.worker }}.txt
          rustc -Vv > c3c-raw/rust-${{ matrix.worker }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3c-worker-${{ matrix.worker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: c3c-raw/
          if-no-files-found: error

  aggregate:
    needs: worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: c3c-worker-*
          path: c3c-input
          merge-multiple: true
      - name: Validate all two-party source-bound observations
        run: |
          mkdir -p c3c-summary
          python research/strict_compact_opt_c3_sender_first_summarize.py --logs-dir c3c-input --head "$(git rev-parse HEAD)" --out c3c-summary/evidence.json | tee c3c-summary/summary.txt
          grep -q '^C3C_EVIDENCE_PASS records=1440 ' c3c-summary/summary.txt
          git rev-parse HEAD > c3c-summary/head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c3c-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: c3c-summary/
          if-no-files-found: error
